# De-paperfy — South-African config for Google Health medical-data-toolkit.
# Drop-in replacement for the toolkit's src/config.yaml. Differences from the
# shipped config: on-prem LLMs via LiteLLM->vLLM (offline, no Gemini), and the
# LAB_REPORT type is generated by the ZA base-R4 generator (registered by the
# setup script — see README.md). Placeholders marked <...>.

logging_level: "INFO"

# --- On-prem models (offline). Point both at your vLLM OpenAI-compatible server:
#     vllm serve Qwen/Qwen3-VL-8B-Instruct --port 8000
#     vllm serve google/medgemma-1.5-4b-it --port 8001   (or one server, two models)
classifier_llm_client:
  type: "LiteLLMClient"
  parameters:
    model: "hosted_vllm/google/medgemma-1.5-4b-it"
    api_base: "http://<vllm-host>:8001/v1"
    api_key_env: "DUMMY_KEY"          # vLLM ignores it; LiteLLM requires the var to exist

extractor_llm_client:
  type: "LiteLLMClient"
  parameters:
    model: "hosted_vllm/Qwen/Qwen3-VL-8B-Instruct"   # strong reader = our OCR strength
    api_base: "http://<vllm-host>:8000/v1"
    api_key_env: "DUMMY_KEY"
    supports_pdf: false                # images only; PDFs are split to images upstream

max_pdf_pages: 40

supported_types:
  - "LABORATORY_REPORT"

document_standardization_policy: ACCEPT_ALL
ATTACH_DOCUMENT_TO_BUNDLE: false
RETURN_METADATA: false

# LOINC knowledge-base CSVs — build once (see toolkit's LOINC README) and mount at /data.
loinc_analaytes_index_csv_path: "/data/analyte_records_top_2000.csv"
loinc_system_kb_csv_path: "/data/loinc_axis_system_kb_top_2000.csv"
loinc_property_kb_csv_path: "/data/loinc_axis_property_kb_top_2000.csv"
